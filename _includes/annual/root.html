<style>
:root {

  --page-max-width: 1400px;

  /* Brand (--acc) */
  --acc-h:  210.99deg;
  --acc-s:  100.00%;
  --acc-l:  17.84%;
  --acc: hsl(var(--acc-h), var(--acc-s), var(--acc-l));

  /* Primary */
  --primary-h: 355.71deg;
  --primary-s: 71.65%;
  --primary-l: 50.20%;
  --primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));

  /* Secondary */
  --secondary-h: 347.73deg;
  --secondary-s: 19.13%;
  --secondary-l: 45.10%;
  --secondary: hsl(var(--secondary-h), var(--secondary-s), var(--secondary-l));

  /* Accent */
  --accent-h:  174.93deg;
  --accent-s:  61.21%;
  --accent-l:  45.49%;

  --code-color: hsla(
    var(--accent-h),
    calc(var(--accent-s) + 5% - var(--accent-s) * 0.05),
    calc(var(--accent-l) - var(--accent-l) * 0.5),
    1

  --highlight-h: 40.74deg;
  --highlight-s: 91.49%;
  --highlight-l: 53.92%;

  --shade-s: 7.09%;
  --shade-l: 50.20%;

  --navigation-s: 42.06%;
  --navigation-l: 20.98%;

  --success-s: 65.12%;
  --success-l: 33.73%;

  --warning-s: 87.62%;
  --warning-l: 58.82%;

  --link-color-light-s: 60.19%;
