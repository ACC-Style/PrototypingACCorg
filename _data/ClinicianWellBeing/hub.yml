intro:
  heading: Why ACC Cares for You
  body_1: Cardiovascular professionals practice in high-stakes environments every day. When clinicians are depleted, patients and teams feel the impact. The ACC is committed to reversing that cycle.
  body_2: Burnout is driven by unsupportive health systems, including workforce shortage, administrative burden, and an unhealthy culture. That is why ACC pairs personal tools with workplace guidance and national advocacy.
  cardio_safe:
    title: Cardio Safe
    body: Cardio Safe focuses on addressing patient- and visitor-initiated mistreatment of cardiologists.
    button: Learn More