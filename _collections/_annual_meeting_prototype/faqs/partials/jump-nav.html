{%- comment -%}
  In-page jump nav for FAQ groups + filter (filter last in the sticky box).
  Expects: spoke (with groups[], spoke_id)
{%- endcomment -%}
<nav class="m-b_4 p_3 bg_black-1 br_radius sticky t_3" aria-label="On this page" data-role="faq-jump-nav">
  <p class="font_bold m-b_2 m-t_0">On this page</p>
  <ul class="ul_none grid gap_2 m_0" data-role="faq-jump-list">
    {%- for group in spoke.groups -%}
    <li class="m_0 p_0">
      <a class="link a:bg_secondary-n2 a:c_white block p-x_3 p-y_2" href="#g-{{ group.group_id }}" data-role="faq-jump-link">{{ group.group_label }}</a>
    </li>
    {%- endfor -%}
  </ul>
  <div class="m-t_4 flex flex_column gap_2" data-role="faq-filter-bar">
    <label class="font_bold" for="faq-filter-{{ spoke.spoke_id }}">Filter questions</label>
    <input
      id="faq-filter-{{ spoke.spoke_id }}"
      type="search"
      class="br_1 br_black-3 br_solid br_radius p_3 w_100"
      data-role="faq-filter"
      placeholder="Type to filter…"
      autocomplete="off">
    <p class="font-size_down c_black-7 m_0" data-role="faq-filter-status" aria-live="polite"></p>
  </div>
</nav>
