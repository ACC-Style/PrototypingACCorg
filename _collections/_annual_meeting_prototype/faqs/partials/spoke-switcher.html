{%- comment -%}
  Spoke-to-spoke navigation.
  Expects: current_spoke_id, all_spokes (array)
{%- endcomment -%}
<nav class="m-b_4" aria-label="FAQ topics" data-role="faq-spoke-switcher">
  <ul class="ul_none flex flex_row flex_wrap gap_2 m_0">
    <li>
      <a
        class="btn btn-sm {% if current_spoke_id == 'hub' %}btn-primary{% else %}btn-outline-shade{% endif %}"
        href="{{ '/AnnualMeeting/faqs/' | relative_url }}">All FAQs</a>
    </li>
    {%- for s in all_spokes -%}
    <li>
      <a
        class="btn btn-sm {% if s.spoke_id == current_spoke_id %}btn-primary{% else %}btn-outline-shade{% endif %}"
        href="{{ s.canonical_path | relative_url }}">{{ s.spoke_label }}</a>
    </li>
    {%- endfor -%}
  </ul>
</nav>
